<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastSchool | 智能互动学习终端</title>
    
    
    <style>
        :root {
            --bg-paper: #fdfcf8;
            --ink-deep: #1a1c1e;
            --ink-medium: #454749;
            --ink-light: #8e9193;
            --accent-primary: #2d5af6;
            --accent-soft: #eef2ff;
            --highlighter: #fff9c4;
            --success: #10b981;
            --border: #e2e4e7;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 12px 32px rgba(0,0,0,0.08);
            --serif: ui-serif, Georgia, 'Times New Roman', serif;
            --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #f4f5f7;
            color: var(--ink-deep);
            font-family: var(--sans);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- Background Decoration --- */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.4;
            z-index: -1;
        }

        /* --- Header --- */
        header {
            padding: 32px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: -0.5px;
            color: var(--ink-deep);
        }

        .brand span {
            background: var(--ink-deep);
            color: white;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 18px;
        }

        /* --- Main Container --- */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            perspective: 1000px;
        }

        .app-card {
            background: var(--bg-paper);
            width: 100%;
            max-width: 800px;
            min-height: 600px;
            border-radius: 24px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            position: relative;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
        }

        /* --- Upload Section --- */
        #uploadSection {
            padding: 80px 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: center;
        }

        .hero-title {
            font-family: var(--serif);
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--ink-deep);
        }

        .hero-subtitle {
            color: var(--ink-light);
            font-size: 18px;
            margin-bottom: 48px;
            max-width: 400px;
        }

        .mode-selector {
            display: inline-flex;
            background: #f0f1f4;
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 40px;
            gap: 4px;
        }

        .mode-option {
            padding: 10px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mode-option input {
            display: none;
        }

        .mode-option:has(input:checked) {
            background: white;
            color: var(--accent-primary);
            box-shadow: var(--shadow-sm);
        }

        .drop-zone {
            width: 100%;
            max-width: 500px;
            height: 240px;
            border: 2px dashed #cbd2d9;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255,255,255,0.5);
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent-primary);
            background: var(--accent-soft);
            transform: translateY(-4px);
        }

        .upload-icon {
            width: 64px;
            height: 64px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.3s;
        }

        .drop-zone:hover .upload-icon {
            transform: scale(1.1) rotate(5deg);
        }

        /* --- Quiz Section --- */
        #quizSection {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .quiz-header {
            padding: 24px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
        }

        .quiz-progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 4px;
            background: var(--accent-primary);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        .btn-icon {
            background: none;
            border: 1px solid var(--border);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--ink-medium);
        }

        .btn-icon:hover {
            background: #f4f5f7;
            border-color: var(--ink-deep);
            color: var(--ink-deep);
        }

        .quiz-content {
            padding: 48px 60px;
            flex: 1;
            overflow-y: auto;
        }

        .question-meta {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-primary);
            font-weight: 700;
            margin-bottom: 16px;
            display: block;
        }

        .question-stem {
            font-family: var(--serif);
            font-size: 24px;
            line-height: 1.6;
            color: var(--ink-deep);
            margin-bottom: 40px;
            animation: fadeIn 0.5s ease-out;
        }

        .options-grid {
            display: grid;
            gap: 16px;
            animation: slideUp 0.6s ease-out;
        }

        .option-item {
            padding: 20px 24px;
            border: 1px solid var(--border);
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            transition: all 0.2s;
            background: white;
        }

        .option-item:hover {
            border-color: var(--ink-deep);
            transform: translateX(4px);
        }

        .option-item.selected {
            background: var(--ink-deep);
            border-color: var(--ink-deep);
            color: white;
        }

        .option-key {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--accent-soft);
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
            font-size: 14px;
        }

        .option-item.selected .option-key {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .quiz-footer {
            padding: 32px 60px;
            display: flex;
            gap: 16px;
            background: linear-gradient(to top, var(--bg-paper), transparent);
        }

        .btn-primary {
            flex: 1;
            background: var(--ink-deep);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .btn-secondary {
            background: white;
            color: var(--ink-deep);
            border: 1px solid var(--border);
            padding: 16px 24px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: #f4f5f7;
        }

        /* --- Loading State --- */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--accent-soft);
            border-top: 4px solid var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* --- Animations --- */
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Responsive --- */
        @media (max-width: 640px) {
            header { padding: 20px; }
            .hero-title { font-size: 32px; }
            .quiz-content { padding: 32px 24px; }
            .quiz-footer { padding: 24px; }
            .app-card { border-radius: 0; min-height: 100vh; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>

    <header>
        <div class="brand">
            <span>FS</span> FastSchool
        </div>
        <div id="statusTag" style="font-size: 12px; font-weight: 700; color: var(--ink-light); display: none;">
            READY TO STUDY
        </div>
    </header>

    <main>
        <div class="app-card" id="appCard">
            <!-- Loading Overlay -->
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <p style="margin-top: 24px; font-weight: 600;">正在智能解析试卷...</p>
                <p style="font-size: 13px; color: var(--ink-light); margin-top: 8px;">这可能需要几秒钟时间</p>
            </div>

            <!-- Upload Section -->
            <section id="uploadSection">
                <h1 class="hero-title">开启高效刷题</h1>
                <p class="hero-subtitle">上传 PDF 试卷，系统将按版面结构自动截图分割题干与选项。</p>

                <div style="width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <div style="font-size: 12px; font-weight: 700; color: var(--ink-light); letter-spacing: 1px;">可选</div>
                    <button id="answerUploadBtn" class="btn-secondary" style="padding: 10px 14px; border-radius: 12px; font-size: 13px;">上传答案</button>
                </div>
                <div id="answerStatus" style="width: 100%; max-width: 500px; display: none; margin-bottom: 18px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px; background: white; font-size: 13px; color: var(--ink-medium);"></div>

                <div class="drop-zone" id="dropZone">
                    <div class="upload-icon">📄</div>
                    <div style="font-weight: 700; font-size: 18px;">点击或拖拽文件到这里</div>
                    <p style="color: var(--ink-light); font-size: 14px; margin-top: 8px;">仅支持 .pdf 格式</p>
                </div>
                <input type="file" id="fileInput" accept=".pdf" style="display: none;">
                <input type="file" id="answerInput" accept=".pdf,.png,.jpg,.jpeg,.txt" style="display: none;">
            </section>

            <!-- Quiz Section -->
            <section id="quizSection">
                <div class="quiz-progress-bar" id="progressBar"></div>
                
                <div class="quiz-header">
                    <button class="btn-icon" id="backToUpload" title="重新上传">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                    <div style="text-align: center;">
                        <div id="quizFileName" style="font-weight: 700; font-size: 14px; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
                        <div id="quizMeta" style="font-size: 12px; color: var(--ink-light);">正在进行第 1 题</div>
                    </div>
                    <div style="width: 40px;"></div> <!-- Spacer -->
                </div>

                <div class="quiz-content">
                    <span class="question-meta" id="qTypeLabel">Multiple Choice</span>
                    <div class="question-stem" id="qStem"></div>
                    <div class="options-grid" id="optionsGrid"></div>
                    <div id="fillContainer" style="display: none;">
                        <textarea class="option-item" style="width: 100%; height: 120px; font-family: inherit; resize: none;" placeholder="在这里输入你的答案..."></textarea>
                    </div>
                </div>

                <div class="quiz-footer">
                    <button class="btn-secondary" id="prevBtn" style="visibility: hidden;">上一题</button>
                    <button class="btn-primary" id="nextBtn">
                        <span>下一题</span>
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </section>

            <div id="judgeModal" class="loading-overlay" style="display:none; background: rgba(17, 24, 39, 0.55);">
                <div style="width: 100%; max-width: 520px; background: white; border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-md); padding: 22px; margin: 0 18px;">
                    <div id="judgeTitle" style="font-size: 18px; font-weight: 800; margin-bottom: 10px;"></div>
                    <div id="judgeDetail" style="font-size: 14px; color: var(--ink-medium); line-height: 1.7;"></div>
                    <div style="display:flex; gap: 10px; justify-content: flex-end; margin-top: 18px;">
                        <button id="judgeContinue" class="btn-primary" style="flex: 0 0 auto; padding: 12px 16px; border-radius: 12px; font-size: 14px;">继续</button>
                    </div>
                </div>
            </div>

            <!-- Complete Section -->
            <section id="completeSection" style="display: none; padding: 80px 40px; text-align: center; height: 100%; justify-content: center; flex-direction: column; align-items: center;">
                <div style="font-size: 80px; margin-bottom: 32px;">🏆</div>
                <h2 style="font-family: var(--serif); font-size: 32px; margin-bottom: 12px;">学习任务完成！</h2>
                <p style="color: var(--ink-light); margin-bottom: 48px;">你已经完成了本卷的所有题目解析与练习。</p>
                <div style="display: flex; gap: 24px; margin-bottom: 48px;">
                    <div style="text-align: center;">
                        <div id="resTotal" style="font-size: 32px; font-weight: 700;">0</div>
                        <div style="font-size: 12px; color: var(--ink-light);">总题数</div>
                    </div>
                    <div style="width: 1px; background: var(--border);"></div>
                    <div style="text-align: center;">
                        <div id="resDone" style="font-size: 32px; font-weight: 700; color: var(--success);">0</div>
                        <div style="font-size: 12px; color: var(--ink-light);">已回答</div>
                    </div>
                </div>
                <div id="wrongList" style="display:none; width: 100%; max-width: 520px; margin-bottom: 28px; text-align: left;">
                    <div style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: var(--ink-light); margin-bottom: 10px;">错题</div>
                    <div id="wrongChips" style="display:flex; flex-wrap: wrap; gap: 8px;"></div>
                </div>
                <button class="btn-primary" onclick="location.reload()" style="max-width: 240px; width: 100%;">返回首页</button>
            </section>
        </div>
    </main>

    <script>
        let questions = [];
        let currentIndex = 0;
        let userAnswers = {};
        let answerKeyId = null;
        let answerMap = {};
        let wrongQuestionIds = [];

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const answerInput = document.getElementById('answerInput');
        const answerUploadBtn = document.getElementById('answerUploadBtn');
        const answerStatus = document.getElementById('answerStatus');
        const loading = document.getElementById('loadingOverlay');
        const uploadSection = document.getElementById('uploadSection');
        const quizSection = document.getElementById('quizSection');
        const completeSection = document.getElementById('completeSection');
        const progressBar = document.getElementById('progressBar');

        const judgeModal = document.getElementById('judgeModal');
        const judgeTitle = document.getElementById('judgeTitle');
        const judgeDetail = document.getElementById('judgeDetail');
        const judgeContinue = document.getElementById('judgeContinue');
        let pendingNextAction = null;

        // File Selection
        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('dragover');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        };
        fileInput.onchange = (e) => {
            if (e.target.files[0]) handleFile(e.target.files[0]);
        };

        answerUploadBtn.onclick = (e) => {
            e.preventDefault();
            answerInput.click();
        };

        answerInput.onchange = (e) => {
            if (e.target.files[0]) handleAnswerFile(e.target.files[0]);
        };

        async function handleAnswerFile(file) {
            loading.style.display = 'flex';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/upload_answerkey', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    answerKeyId = data.id;
                    answerMap = data.answers || {};
                    answerStatus.style.display = 'block';
                    const parsedText = data.parsed ? `已识别 ${data.count || 0} 条答案` : '未解析（仅存储）';
                    answerStatus.textContent = `答案已上传：${data.filename}（${Math.ceil((data.size || 0) / 1024)} KB，${parsedText}）`;
                } else {
                    showError(data.error || '答案上传失败');
                }
            } catch (err) {
                showError('答案上传失败：无法连接服务器');
            } finally {
                loading.style.display = 'none';
                answerInput.value = '';
            }
        }

        async function handleFile(file) {
            loading.style.display = 'flex';
            
            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch(`/upload_screenshot`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.success && data.questions?.length > 0) {
                    questions = data.questions;
                    document.getElementById('quizFileName').textContent = data.filename;
                    document.getElementById('statusTag').style.display = 'block';
                    startQuiz();
                } else {
                    // 更加详细的错误提示
                    const errorMsg = data.error || '未能识别到题目，请检查文件格式。';
                    showError(errorMsg);
                }
            } catch (err) {
                showError('连接服务器失败，请检查网络或后端状态。');
            } finally {
                loading.style.display = 'none';
            }
        }

        function showError(msg) {
            // 在上传区域显示错误信息
            const heroSubtitle = document.querySelector('.hero-subtitle');
            heroSubtitle.style.color = '#ef4444';
            heroSubtitle.style.fontWeight = '600';
            heroSubtitle.textContent = `❌ ${msg}`;
            
            // 3秒后恢复
             setTimeout(() => {
                heroSubtitle.style.color = 'var(--ink-light)';
                heroSubtitle.style.fontWeight = '400';
                 heroSubtitle.textContent = '上传 PDF 试卷，系统将按版面结构自动截图分割题干与选项。';
            }, 6000);
        }

        function startQuiz() {
            uploadSection.style.display = 'none';
            quizSection.style.display = 'flex';
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentIndex];
            const qParsed = q.parsed || q; // Compatibility
            
            // Progress
            const progress = ((currentIndex + 1) / questions.length) * 100;
            progressBar.style.width = `${progress}%`;
            document.getElementById('quizMeta').textContent = `正在进行第 ${currentIndex + 1} / ${questions.length} 题`;

            // Content
            document.getElementById('qTypeLabel').textContent = q.type || '题目';

            // 截图模式：优先展示题干图片
            if (qParsed.stem_image) {
                document.getElementById('qStem').innerHTML = `
                    <div style="font-size: 14px; color: var(--ink-light); margin-bottom: 10px;">${currentIndex + 1}.</div>
                    <img src="${qParsed.stem_image}" alt="question" style="max-width: 100%; width: auto; height: auto; display: block; margin: 0 auto; border-radius: 14px; border: 1px solid var(--border); background: white;" />
                `;
            } else {
                document.getElementById('qStem').textContent = `${currentIndex + 1}. ${qParsed.stem || ''}`;
            }
            
            const grid = document.getElementById('optionsGrid');
            const fill = document.getElementById('fillContainer');
            grid.innerHTML = '';
            grid.style.display = 'none';
            fill.style.display = 'none';

            if (q.type === '选择' || (qParsed.options && Object.keys(qParsed.options).length > 0)) {
                grid.style.display = 'grid';
                const options = qParsed.options || {};
                for (const [key, text] of Object.entries(options)) {
                    const item = document.createElement('div');
                    item.className = `option-item ${userAnswers[currentIndex] === key ? 'selected' : ''}`;
                    const contentHtml = (text && typeof text === 'object' && text.image)
                        ? `<img src="${text.image}" alt="option ${key}" style="max-width: 100%; width: auto; height: auto; display: block; border-radius: 12px; border: 1px solid var(--border); background: white;" />`
                        : `<div>${text}</div>`;
                    item.innerHTML = `<div class="option-key">${key}</div><div style="flex: 1;">${contentHtml}</div>`;
                    item.onclick = () => {
                        userAnswers[currentIndex] = key;
                        document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
                        item.classList.add('selected');
                    };
                    grid.appendChild(item);
                }
            } else if (q.type === '判断') {
                grid.style.display = 'grid';
                const choices = [['√', 'true', '正确'], ['×', 'false', '错误']];
                choices.forEach(([icon, val, label]) => {
                    const item = document.createElement('div');
                    item.className = `option-item ${userAnswers[currentIndex] === val ? 'selected' : ''}`;
                    item.innerHTML = `<div class="option-key">${icon}</div><div>${label}</div>`;
                    item.onclick = () => {
                        userAnswers[currentIndex] = val;
                        document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
                        item.classList.add('selected');
                    };
                    grid.appendChild(item);
                });
            } else {
                fill.style.display = 'block';
                const textarea = fill.querySelector('textarea');
                textarea.value = userAnswers[currentIndex] || '';
                textarea.oninput = (e) => { userAnswers[currentIndex] = e.target.value; };
            }

            // Navigation
            document.getElementById('prevBtn').style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
            document.getElementById('nextBtn').querySelector('span').textContent = 
                currentIndex === questions.length - 1 ? '提交试卷' : '下一题';

            
        }

        function normalizeAnswerMap(map) {
            const out = {};
            if (!map || typeof map !== 'object') return out;
            for (const [k, v] of Object.entries(map)) {
                const id = parseInt(k, 10);
                if (!Number.isFinite(id)) continue;
                out[id] = String(v || '').trim().toUpperCase();
            }
            return out;
        }

        function showJudge(result) {
            const { status, user, correct, qid } = result;
            if (status === 'no_key') {
                pendingNextAction && pendingNextAction();
                return;
            }

            judgeModal.style.display = 'flex';
            if (status === 'unanswered') {
                judgeTitle.textContent = '未作答';
                judgeDetail.textContent = `第 ${qid} 题没有选择答案。`;
            } else if (status === 'no_answer') {
                judgeTitle.textContent = '无标准答案';
                judgeDetail.textContent = `答案文件中未找到第 ${qid} 题的标准答案。`; 
            } else if (status === 'correct') {
                judgeTitle.textContent = '回答正确';
                judgeDetail.textContent = `第 ${qid} 题：你选 ${user}，标准答案 ${correct}。`;
            } else {
                judgeTitle.textContent = '回答错误';
                judgeDetail.textContent = `第 ${qid} 题：你选 ${user}，标准答案 ${correct}。`;
            }
        }

        judgeContinue.onclick = () => {
            judgeModal.style.display = 'none';
            pendingNextAction && pendingNextAction();
        };

        function evaluateAndNext() {
            const q = questions[currentIndex];
            const qid = q.id || (currentIndex + 1);
            const normalized = normalizeAnswerMap(answerMap);

            if (!answerKeyId || Object.keys(normalized).length === 0) {
                return { status: 'no_key', qid };
            }

            const user = userAnswers[currentIndex];
            if (!user) {
                if (!wrongQuestionIds.includes(qid)) wrongQuestionIds.push(qid);
                return { status: 'unanswered', qid };
            }

            const correct = normalized[qid];
            if (!correct) {
                return { status: 'no_answer', qid, user };
            }

            if (String(user).toUpperCase() === correct) {
                return { status: 'correct', qid, user: String(user).toUpperCase(), correct };
            }

            if (!wrongQuestionIds.includes(qid)) wrongQuestionIds.push(qid);
            return { status: 'wrong', qid, user: String(user).toUpperCase(), correct };
        }

        document.getElementById('prevBtn').onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        };

        document.getElementById('nextBtn').onclick = () => {
            const action = () => {
                if (currentIndex < questions.length - 1) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    showResults();
                }
            };

            pendingNextAction = action;
            const result = evaluateAndNext();
            showJudge(result);
        };

        document.getElementById('backToUpload').onclick = () => {
            if (confirm('确定要放弃当前练习并重新上传吗？')) {
                location.reload();
            }
        };

        function showResults() {
            quizSection.style.display = 'none';
            completeSection.style.display = 'flex';
            document.getElementById('resTotal').textContent = questions.length;
            document.getElementById('resDone').textContent = Object.keys(userAnswers).length;

            const wrongList = document.getElementById('wrongList');
            const wrongChips = document.getElementById('wrongChips');
            wrongChips.innerHTML = '';
            const uniqueWrong = Array.from(new Set(wrongQuestionIds)).sort((a,b) => a-b);

            if (uniqueWrong.length > 0) {
                wrongList.style.display = 'block';
                uniqueWrong.forEach((qid) => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-secondary';
                    btn.style.padding = '10px 12px';
                    btn.style.borderRadius = '999px';
                    btn.style.fontSize = '13px';
                    btn.textContent = `第 ${qid} 题`;
                    btn.onclick = () => {
                        const idx = questions.findIndex(q => (q.id || 0) === qid);
                        if (idx >= 0) {
                            completeSection.style.display = 'none';
                            quizSection.style.display = 'flex';
                            currentIndex = idx;
                            renderQuestion();
                        }
                    };
                    wrongChips.appendChild(btn);
                });
            } else {
                wrongList.style.display = 'none';
            }
        }
    </script>
</body>
</html>
